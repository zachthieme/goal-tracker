# The gates on every push to main and every pull request: the same
# `make check` vetinari runs on each campaign merge, so a commit made outside a
# campaign is checked too. Then the app's image is built, so the Dockerfile
# can't rot.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Pinned with the Makefile's GOLANGCI_LINT_VERSION and
      # vetinari/Dockerfile; installed as a binary, so `make lint` uses it
      # rather than building it.
      - name: Install golangci-lint
        run: curl -fsSL https://raw.githubusercontent.com/golangci/golangci-lint/v2.13.2/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
      - run: make check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t goal-tracker:ci .
