version: "2"
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    # Every top-level test calls t.Parallel(), so a package's tests share the
    # cores instead of queueing behind the race detector. A test that can't
    # run in parallel says why with //nolint:paralleltest. Subtests may stay
    # serial.
    - paralleltest
    # A request or query made without a context.
    - noctx
    # An HTTP response whose body is never closed.
    - bodyclose
    # An error compared with == or a type switch, or wrapped with %v, so a
    # wrapped error isn't found.
    - errorlint
    # A function that drops the context its caller has.
    - contextcheck
  settings:
    paralleltest:
      ignore-missing-subtests: true
  exclusions:
    rules:
      # contextcheck can't follow a context through a struct field, and templ's
      # generated components take theirs in one: a component's closures read
      # it from templruntime.GeneratedComponentInput.Context, which holds the
      # ctx its Render was given (render passes the request's). So a chain
      # into a component's closures is reported as dropping the context,
      # though nothing there makes a new one.
      #
      # This matches a chain that ends in a component's own closure: a
      # function, then its first closure (the one templ hands
      # GeneratedTemplate), then optionally that closure's own closure (a
      # children block), as in `page->page$1->layout->layout$1->layout$1$2`.
      # Whatever comes before that end isn't checked. A chain that ends
      # anywhere else is still reported, such as a closure that calls a
      # function which passes context.Background() on
      # (`helper->helper$1->drop`). The text alone can't tell templ's
      # functions from hand-written ones, so a hand-written chain of the same
      # shape, a function whose first closure drops the context itself
      # (`helper->helper$1`), is hidden too.
      - path: ^internal/web/
        linters:
          - contextcheck
        text: "^Function `([\\w$]+->)*\\w+->\\w+\\$1(->\\w+\\$1\\$\\d+)?` "
# Fail on hand-written Go code that isn't gofmt-formatted (simplify is on by
# default). golangci-lint skips generated files here; make generate-check
# guards those by regenerating them and diffing against what is committed.
formatters:
  enable:
    - gofmt
