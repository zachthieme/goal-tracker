version: "2"
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    # Every top-level test calls t.Parallel(), so a package's tests share the
    # cores instead of queueing behind the race detector. A test that can't
    # run in parallel says why with //nolint:paralleltest. Subtests may stay
    # serial.
    - paralleltest
    # A request or query made without a context.
    - noctx
    # An HTTP response whose body is never closed.
    - bodyclose
    # An error compared with == or a type switch, or wrapped with %v, so a
    # wrapped error isn't found.
    - errorlint
    # A function that drops the context its caller has.
    - contextcheck
  settings:
    paralleltest:
      ignore-missing-subtests: true
  # contextcheck has no exclusion here. It can't follow a context through a
  # struct field, and templ hands a component's closures the ctx its Render
  # was given in one (templruntime.GeneratedComponentInput.Context), so every
  # templ component looks as though it drops the context. The components
  # hand-written code calls carry //nolint:contextcheck in their doc comment,
  # which templ copies onto the generated function: contextcheck then stops at
  # that component, and still follows every hand-written chain. A component
  # newly called from hand-written code is reported until it gets the
  # directive too.
# Fail on hand-written Go code that isn't gofmt-formatted (simplify is on by
# default). golangci-lint skips generated files here; make generate-check
# guards those by regenerating them and diffing against what is committed.
formatters:
  enable:
    - gofmt
