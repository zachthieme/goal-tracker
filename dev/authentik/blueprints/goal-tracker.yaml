# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Goal Tracker's slice of the local Authentik: the OpenID Connect application
# it signs in through, and a directory of the seed's people, each with their
# manager. Authentik applies this on start, and again whenever it changes.
# See README.md.
version: 1
metadata:
  name: Goal Tracker
entries:
  # The default flows and scope mappings this blueprint points at come from
  # Authentik's own blueprints; apply those first on a fresh volume.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: system/providers-oauth2.yaml
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-authorization-implicit-consent.yaml
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/flow-default-provider-invalidation.yaml
      required: true

  # --- The application -------------------------------------------------------

  # The email scope, like Authentik's default but trusting the directory: the
  # default always says email_verified false, and Goal Tracker signs people in
  # by verified email.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-email
    identifiers:
      name: "Goal Tracker: email"
    attrs:
      scope_name: email
      description: Email address
      expression: |
        return {
            "email": request.user.email,
            "email_verified": bool(request.user.attributes.get("email_verified", False)),
        }

  # The manager scope: the user's manager, by email, in a "manager" claim (ID
  # token and userinfo). The top of the chain gets no claim.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-manager
    identifiers:
      name: "Goal Tracker: manager"
    attrs:
      scope_name: manager
      description: Who you report to
      expression: |
        manager = request.user.attributes.get("manager")
        if not manager:
            return {}
        return {"manager": manager}

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Goal Tracker
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: goal-tracker
      client_secret: !Env GOAL_TRACKER_OIDC_CLIENT_SECRET
      # The app's default address (GOAL_TRACKER_BASE_URL), by either name, and
      # the tailnet address `make start AUTHENTIK=1` serves it at, which it
      # passes in GOAL_TRACKER_TAILNET_CALLBACK (unset, a repeat of the first).
      redirect_uris:
        - matching_mode: strict
          url: http://127.0.0.1:8080/auth/callback
        - matching_mode: strict
          url: http://localhost:8080/auth/callback
        - matching_mode: strict
          url: !Env [GOAL_TRACKER_TAILNET_CALLBACK, http://127.0.0.1:8080/auth/callback]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_email
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf scope-email
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-manager

  - model: authentik_core.application
    identifiers:
      slug: goal-tracker
    attrs:
      name: Goal Tracker
      provider: !KeyOf provider
      meta_launch_url: http://127.0.0.1:8080/

  # --- The directory ---------------------------------------------------------
  #
  # Every Account the seed creates (internal/seed/org.go), with the seed's Name.
  # attributes.manager is the manager's email; the CEO is the top of the chain.
